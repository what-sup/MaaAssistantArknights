name: Master Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit) to build"
        required: false
        default: master
      reason:
        description: "Reason or note for this build"
        required: false
        default: ""
      upload_release:
        description: "Upload artifacts to GitHub release"
        required: false
        type: boolean
        default: true
      release_type:
        description: "Release type when uploading artifacts"
        required: false
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit) to build"
        required: true
        type: string
      reason:
        description: "Reason or note for this build"
        required: false
        type: string
      upload_release:
        description: "Upload artifacts to GitHub release"
        required: false
        type: boolean
        default: true
      release_type:
        description: "Release type when uploading artifacts (release or prerelease)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
      upload_release: ${{ steps.resolve_flags.outputs.upload_release }}
      prerelease: ${{ steps.release_type.outputs.prerelease }}
      make_latest: ${{ steps.release_type.outputs.make_latest }}
    env:
      TARGET_REF: ${{ inputs.ref || 'master' }}
      BUILD_REASON: ${{ inputs.reason || '' }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fetch upstream tags
        env:
          UPSTREAM_REPO: MaaAssistantArknights/MaaAssistantArknights
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --force

      - name: Gather build metadata
        id: meta
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          short_sha=${commit_sha:0:8}
          latest_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo 'v0.0.0')
          tag="${latest_tag}"
          prefix="MAA-${tag}"
          ref_name="${TARGET_REF}"
          reason="${BUILD_REASON}"
          if [ -z "$reason" ]; then
            reason="Automated trigger"
          fi
          timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          repo="${{ github.repository }}"
          commit_url="https://github.com/${repo}/commit/${commit_sha}"
          body="Automated master build for commit ${commit_sha} on ref ${ref_name}.%0A%0ATrigger: ${reason}%0ATime: ${timestamp}%0A%0A[View commit](${commit_url})"

          {
            echo "commit_sha=${commit_sha}"
            echo "release_tag=${tag}"
            echo "artifact_prefix=${prefix}"
            echo "release_name=${latest_tag}"
            echo "release_body=${body}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release upload flag
        id: resolve_flags
        run: |
          input_value="${{ inputs.upload_release }}"
          if [ -z "$input_value" ]; then
            input_value="true"
          fi
          echo "upload_release=$input_value" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release_type
        run: |
          event="${{ github.event_name }}"
          input_type="${{ inputs.release_type }}"
          normalize() {
            case "$1" in
              release) echo "release" ;;
              prerelease) echo "prerelease" ;;
              *) echo "" ;;
            esac
          }
          input_type="$(normalize "$input_type")"
          if [ "$event" = "workflow_dispatch" ]; then
            if [ "$input_type" = "release" ]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$input_type" = "prerelease" ]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  windows-build:
    name: Build Windows (${{ matrix.arch }})
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
      fail-fast: false
    env:
      TARGET_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 src/MaaUtils
          git submodule update --init --depth 1 3rdparty/EmulatorExtras

      - name: Cache MaaDeps
        id: cache-win-maadeps
        uses: actions/cache@v4
        with:
          path: ./src/MaaUtils/MaaDeps
          key: master-windows-${{ matrix.arch }}-maadeps-${{ hashFiles('tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-win-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/maadeps-download.py ${{ matrix.arch }}-windows

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build ${{ matrix.arch == 'arm64' && '-A ARM64' }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMAADEPS_TRIPLET='maa-${{ matrix.arch }}-windows' -DINSTALL_RESOURCE=ON -DINSTALL_PYTHON=ON -DMAA_HASH_VERSION='${{ env.RELEASE_TAG }}' -DBUILD_WPF_GUI=OFF

      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS

      - name: Install
        run: |
          mkdir -p install
          cmake --install build --prefix install --config RelWithDebInfo

      - name: Cache NuGet
        id: cache-nuget
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: master-windows-${{ matrix.arch }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Restore dependencies
        if: steps.cache-nuget.outputs.cache-hit != 'true'
        run: dotnet restore src/MaaWpfGui/MaaWpfGui.csproj

      - name: Taggify version for csproj
        run: |
          $csprojPath = "src/MaaWpfGui/MaaWpfGui.csproj"
          $csprojPath = Resolve-Path -Path $csprojPath
          $tag = '${{ env.RELEASE_NAME }}' -replace '.*?/', ''
          if ($tag -match '\d+(\.\d+){1,3}') {
              $match = $Matches[0]
          } else {
              $match = "0.0.1"
          }
          [xml]$csproj = Get-Content -Path $csprojPath
          $node = $csproj.Project.PropertyGroup | where {$_.ApplicationVersion -ne $null}
          $node.InformationalVersion = $tag
          $node.Version = $match
          $node.FileVersion = $match
          $node.AssemblyVersion = $match
          $csproj.Save($csprojPath)

      - name: Publish WPF GUI
        run: |
          dotnet publish src/MaaWpfGui/MaaWpfGui.csproj -c Release -p:Platform=${{ matrix.arch == 'arm64' && 'ARM64' || 'x64' }} -o install

      - name: Verify GUI output
        shell: pwsh
        run: |
          if (-not (Test-Path "install/MAA.exe")) {
            Write-Error "MAA.exe not found in install directory. WPF publish likely failed."
            exit 1
          }

      - name: Organize install files
        shell: pwsh
        run: |
          Remove-Item install/*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item install/msvc-debug -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item install/*.h -Force -ErrorAction SilentlyContinue
          Copy-Item "tools/DependencySetup_依赖库安装.bat" install

      - name: Zip files
        shell: pwsh
        run: |
          Push-Location install
          $zipName = "${env:ARTIFACT_PREFIX}-win-${{ matrix.arch }}.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -DestinationPath $zipName -Path .\*
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: master-win-${{ matrix.arch }}
          path: install/*.zip
  publish:
    name: Publish release
    if: needs.prepare.outputs.upload_release == 'true'
    needs: [prepare, windows-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect files
        run: |
          mkdir -p upload
          find release-artifacts -type f -print -exec mv {} upload/ \;

      - name: Delete existing release with same tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" -y
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ needs.prepare.outputs.release_body }}
          files: upload/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          fail_on_unmatched_files: true
          append_body: false
          overwrite_files: true
